name: Build Windows Executable

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: |
          mkdir deploy
          copy build\Release\snake_game.exe deploy\
          windeployqt deploy\snake_game.exe --release --no-translations --no-opengl-sw
          xcopy resources deploy\resources\ /E /I

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-windows
          path: deploy/
          retention-days: 30
